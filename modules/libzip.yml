name: libzip
sources:
  - type: git
    url: https://github.com/nih-at/libzip.git
    tag: v1.12.1
    commit: 8e037534ccd62f444abbe4ce265443ee74bbfeb3
    x-checker-data:
      type: git
buildsystem: cmake-ninja
builddir: true
config-opts:
  - -DCMAKE_BUILD_TYPE=Release
  - -DCMAKE_PREFIX_PATH=/app;/usr
