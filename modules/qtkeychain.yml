name: qtkeychain
sources:
  - type: git
    url: https://github.com/frankosterfeld/qtkeychain.git
    tag: 0.18.0
    commit: e86bc3cbb50b172be61ed857803a372412b6ad85
    x-checker-data:
      type: git
buildsystem: cmake-ninja
builddir: true
config-opts:
  - -DCMAKE_BUILD_TYPE=Release
  - -DCMAKE_PREFIX_PATH=/app;/usr
  - -DBUILD_WITH_QT6=ON
  - -DBUILD_TRANSLATIONS=OFF
